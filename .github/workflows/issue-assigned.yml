name: Issue label - Assigned

on:
  issues:
    types: assigned

jobs:
  triage_label:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
      - name: Remove status labels
        uses: issue-ops/labeler@v4.0.0
        with:
          action: remove
          label_patterns: |
            status:*
      - name: Add assigned label
        uses: issue-ops/labeler@v4.0.0
        with:
          label_patterns: |
            status:assigned
        
