name: Issue label - Issue closed

on:
  issues:
    types: closed

jobs:
  label_modify:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
      - name: Remove status labels
        uses: issue-ops/labeler@v4.0.0
        with:
          action: remove
          label_patterns: |
            status:*
      - name: Add duplicate label
        if: github.event.issue.state_reason == 'duplicate'
        uses: issue-ops/labeler@v4.0.0
        with:
          labels: |
            result:duplicate
      - name: Add resolved label
        if: github.event.issue.state_reason == 'completed'
        uses: issue-ops/labeler@v4.0.0
        with:
          labels: |
            result:resolved

      # Use invalid label here by default. Feel free to switch to "declined" label or disable this step if you need.
      - name: Add invalid label
        if: github.event.issue.state_reason == 'not_planned'
        uses: issue-ops/labeler@v4.0.0
        with:
          labels: |
            result:invalid
