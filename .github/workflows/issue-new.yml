name: Issue label - New issue

on:
  issues:
    types: opened

jobs:
  triage_label:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
      - name: Add triage label
        uses: issue-ops/labeler@v4.0.0
        with:
          labels: |
            need-triage
        
