name: Issue label - Reopen issue

on:
  issues:
    types: reopened

jobs:
  triage_label:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
      - name: Add reopen label
        uses: issue-ops/labeler@v4.0.0
        with:
          labels: |
            status:reopened
      - name: Remove result labels
        uses: issue-ops/labeler@v4.0.0
        with:
          action: remove
          label_patterns: |
            result:*
  
